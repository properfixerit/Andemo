name: RubelApp Android Emulator Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rubelapp-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android 37 build platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Configure optional Supabase connection
        env:
          SUPABASE_URL: ${{ vars.RUBELAPP_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.RUBELAPP_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            if [ -n "$SUPABASE_URL" ]; then
              printf 'supabase.rubelapp.url=%s\n' "$SUPABASE_URL"
            fi
            if [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
              printf 'supabase.rubelapp.publishableKey=%s\n' "$SUPABASE_PUBLISHABLE_KEY"
            fi
          } > local.properties

      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon -PskipInstallAndRun=true assembleDebug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubelapp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Install and launch in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            for attempt in $(seq 1 12); do if adb shell cmd package list packages 2>/dev/null | grep -q '^package:'; then break; fi; sleep 5; done; adb shell cmd package list packages 2>/dev/null | grep -q '^package:'
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.ijtc.rubelapp/.MainActivity
            sleep 15
            adb shell pidof com.ijtc.rubelapp

      - name: Publish the latest emulator-tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view test-latest >/dev/null 2>&1; then
            gh release create test-latest \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Latest RubelApp Debug APK" \
              --notes "Latest debug APK that passed the Android emulator test. This download is replaced after each successful run on main."
          fi
          gh release upload test-latest \
            app/build/outputs/apk/debug/app-debug.apk#RubelApp-debug.apk \
            --clobber
